[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travelmap-api"
version = "0.1.0"
description = "Local API for TravelMap"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlmodel>=0.0.22,<1",
  "pycountry>=24.6,<26",
  "geonamescache>=3.0,<4",
  "airportsdata>=2026.8,<2027",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
